<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-shopping-bag me-2"></i>NovaStore</a>
        </div>
    </nav>

    <div class="container my-5">
        <h3 class="fw-bold mb-4">Checkout Details</h3>
        <form id="checkout-form">
            <div class="row">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm p-4 mb-4">
                        <h5 class="fw-bold mb-3"><i class="fas fa-truck me-2 text-primary"></i>Shipping Information</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="cust-name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="cust-email" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="cust-phone" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">City</label>
                                <input type="text" id="cust-city" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Street Address</label>
                                <input type="text" id="cust-address" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Pincode</label>
                                <input type="text" id="cust-pincode" class="form-control" required>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-3 mt-4"><i class="fas fa-credit-card me-2 text-primary"></i>Payment Method</h5>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="Cash on Delivery" checked>
                            <label class="form-check-label fw-bold" for="cod">Cash on Delivery (COD)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="card" value="Credit/Debit Card">
                            <label class="form-check-label fw-bold" for="card">Credit / Debit Card (Simulated)</label>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3">Order Summary</h5>
                        <div id="checkout-summary-list" class="mb-3"></div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Subtotal</span><span id="summary-subtotal" class="fw-bold"></span></div>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Shipping</span><span id="summary-shipping"></span></div>
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Tax (8%)</span><span id="summary-tax"></span></div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4"><span class="fw-bold fs-5">Total Amount</span><span id="summary-total" class="fw-bold fs-4 text-primary"></span></div>
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold">Place Order</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
