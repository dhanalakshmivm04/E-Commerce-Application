<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center py-5">

    <div class="container" style="max-width: 420px;">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand fw-bold text-primary fs-2"><i class="fas fa-shopping-bag me-2"></i>NovaStore</a>
            <p class="text-muted">Create a new account.</p>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <form id="signup-form">
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" id="signup-name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" id="signup-email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="signup-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary rounded-pill w-100 fw-bold py-2 mb-3">Create Account</button>
            </form>

            <div class="text-center">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="small fw-bold text-primary text-decoration-none ms-1">Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById("signup-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("signup-name").value;
            const email = document.getElementById("signup-email").value;
            const pass = document.getElementById("signup-password").value;
            signup(name, email, pass);
        });
    </script>
</body>
</html>
