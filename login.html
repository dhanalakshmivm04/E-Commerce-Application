<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center py-5">

    <div class="container" style="max-width: 420px;">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand fw-bold text-primary fs-2"><i class="fas fa-shopping-bag me-2"></i>NovaStore</a>
            <p class="text-muted">Sign in to your account.</p>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="admin@shop.com or user@shop.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary rounded-pill w-100 fw-bold py-2 mb-3">Sign In</button>
            </form>

            <div class="p-3 bg-light rounded border mb-3">
                <small class="fw-bold d-block mb-1">Demo Credentials:</small>
                <small class="text-muted d-block">Admin: <code>admin@shop.com</code> / <code>admin123</code></small>
                <small class="text-muted d-block">User: <code>user@shop.com</code> / <code>user123</code></small>
            </div>

            <div class="text-center">
                <span class="text-muted small">Don't have an account?</span>
                <a href="signup.html" class="small fw-bold text-primary text-decoration-none ms-1">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;
            login(email, pass);
        });
    </script>
</body>
</html>
